name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore WinDock.slnx
      - name: Build Release
        run: dotnet build WinDock.slnx -c Release --no-restore -m:1
      - name: Run executable tests and generate previews
        run: dotnet run --project tests/WinDock.Tests -c Release --no-build -- --preview artifacts/previews
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windock-previews
          path: artifacts/previews/*.png
          if-no-files-found: ignore
          retention-days: 7
